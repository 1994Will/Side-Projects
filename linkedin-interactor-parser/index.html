<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Interactors Parser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .input-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: monospace;
            resize: vertical;
            margin-bottom: 15px;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .parse-btn {
            background: #667eea;
            color: white;
            flex: 1;
        }

        .parse-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .clear-btn {
            background: #e0e0e0;
            color: #333;
        }

        .clear-btn:hover {
            background: #d0d0d0;
        }

        .results-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .results-header h2 {
            color: #333;
        }

        .count {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .export-btn {
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .reaction-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .reaction-like {
            background: #dbeafe;
            color: #1e40af;
        }

        .reaction-love {
            background: #fce7f3;
            color: #be123c;
        }

        .reaction-insightful {
            background: #d1fae5;
            color: #065f46;
        }

        .reaction-celebrate {
            background: #fef3c7;
            color: #92400e;
        }

        .reaction-support {
            background: #e0e7ff;
            color: #4338ca;
        }

        .name-cell {
            font-weight: 600;
            color: #0a66c2;
        }

        .headline-cell {
            color: #666;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>LinkedIn Interactors Parser</h1>
            <p>Paste your LinkedIn interactors data and organize it instantly</p>
        </div>

        <div class="input-section">
            <textarea id="rawInput" placeholder="Paste your LinkedIn interactors data here..."></textarea>
            <div class="button-group">
                <button class="parse-btn" onclick="parseData()">Parse Data</button>
                <button class="clear-btn" onclick="clearData()">Clear</button>
            </div>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2>Parsed Results</h2>
                <span class="count" id="countBadge">0 interactors</span>
            </div>

            <div class="export-buttons">
                <button class="export-btn" onclick="exportToCSV()">Export to CSV</button>
                <button class="export-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
            </div>

            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Reaction</th>
                        <th>Name</th>
                        <th>Headline</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let parsedData = [];

        function parseData() {
            const rawText = document.getElementById('rawInput').value.trim();

            if (!rawText) {
                alert('Please paste some data first!');
                return;
            }

            const lines = rawText.split('\n').map(line => line.trim()).filter(line => line);
            parsedData = [];

            const reactions = ['like', 'love', 'insightful', 'celebrate', 'support', 'curious', 'funny'];

            let i = 0;
            while (i < lines.length) {
                const line = lines[i].toLowerCase();

                // Check if this line is a reaction type
                if (reactions.includes(line)) {
                    const reaction = line;
                    i++;

                    // Next non-empty line should be the name
                    if (i < lines.length) {
                        const name = lines[i];
                        i++;

                        // Skip "View [name]'s profile" line
                        while (i < lines.length &&
                               (lines[i].startsWith('View ') ||
                                lines[i].includes('degree connection') ||
                                lines[i].startsWith('·'))) {
                            i++;
                        }

                        // Next line should be the headline
                        const headline = i < lines.length ? lines[i] : '';

                        parsedData.push({
                            reaction: reaction,
                            name: name,
                            headline: headline
                        });

                        i++;
                    }
                } else {
                    i++;
                }
            }

            displayResults();
        }

        function displayResults() {
            const resultsSection = document.getElementById('resultsSection');
            const resultsBody = document.getElementById('resultsBody');
            const countBadge = document.getElementById('countBadge');

            if (parsedData.length === 0) {
                alert('No data could be parsed. Please check your input format.');
                return;
            }

            resultsBody.innerHTML = '';

            parsedData.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><span class="reaction-badge reaction-${item.reaction}">${item.reaction}</span></td>
                    <td class="name-cell">${item.name}</td>
                    <td class="headline-cell">${item.headline}</td>
                `;
                resultsBody.appendChild(row);
            });

            countBadge.textContent = `${parsedData.length} interactor${parsedData.length !== 1 ? 's' : ''}`;
            resultsSection.classList.add('show');

            // Scroll to results
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function clearData() {
            document.getElementById('rawInput').value = '';
            document.getElementById('resultsSection').classList.remove('show');
            parsedData = [];
        }

        function exportToCSV() {
            if (parsedData.length === 0) {
                alert('No data to export!');
                return;
            }

            let csv = 'Reaction,Name,Headline\n';
            parsedData.forEach(item => {
                const headline = item.headline.replace(/"/g, '""');
                csv += `"${item.reaction}","${item.name}","${headline}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `linkedin-interactors-${Date.now()}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function copyToClipboard() {
            if (parsedData.length === 0) {
                alert('No data to copy!');
                return;
            }

            let text = 'Reaction\tName\tHeadline\n';
            parsedData.forEach(item => {
                text += `${item.reaction}\t${item.name}\t${item.headline}\n`;
            });

            navigator.clipboard.writeText(text).then(() => {
                alert('Data copied to clipboard!');
            }).catch(err => {
                alert('Failed to copy to clipboard');
            });
        }
    </script>
</body>
</html>
